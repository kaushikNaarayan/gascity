name: fork-verify

# Real CI gate for gascity forks, on OUR self-hosted [self-hosted, gt2]
# runners — not GitHub-hosted ubuntu-latest. This fork's included Actions
# minutes are exhausted, so every hosted job dies in seconds with "recent
# account payments have failed"; gt2 is the only runner pool that actually
# executes anything here. gt2 is shared across the whole org (3 runners,
# ~90% disk), so this workflow stays intentionally light: build, vet, the
# cipolicy hash check, and four targeted unit-test slices — not the full
# 47-job upstream matrix.
#
# Does NOT reuse .github/actions/setup-gascity-ubuntu: that composite runs
# `sudo apt-get install -y tmux jq`, and self-hosted runners do not grant
# passwordless root. Setup is inlined below using each install script's
# --cache mode (installs under RUNNER_TOOL_CACHE/HOME, no sudo required).
# Do not edit the shared composite action — ci.yml depends on it.

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      fresh_runs:
        description: "release-path-regression: number of fresh gc init runs (standing gate = 3; pm's rate measurement = 10)"
        required: false
        default: "3"
      keep_going:
        description: "release-path-regression: 1 = keep going past a failing fresh init and report N/M (rate measurement); 0 = stop at first failure (standing gate)"
        required: false
        default: "0"

permissions:
  contents: read

jobs:
  verify:
    # Canonical PR branches on the upstream repo already run the complete
    # Blacksmith CI graph. This gate exists only for the fork, which cannot
    # use those runners or repository secrets.
    if: ${{ github.repository != 'gastownhall/gascity' }}
    runs-on: [self-hosted, pool]
    env:
      DOLT_VERSION: "2.1.10"
      BD_VERSION: "v1.1.0"
      GO_VERSION: "1.26.5"
      # gt2's root filesystem is shared by all three runners, /tmp and every
      # agent worktree. It has hit 0 bytes free before (gcf-b7fn) and the
      # resulting job failures were indistinguishable from a code failure —
      # every step up to actions/setup-go's cache save had passed. This
      # threshold is a preflight tripwire, not a capacity plan.
      FORK_VERIFY_MIN_FREE_GB: "5"
    steps:
      - name: Preflight — fail fast and loud on host disk exhaustion (gcf-b7fn)
        run: |
          set -euo pipefail
          df_line="$(df -Pk . | tail -1)"
          fs="$(echo "$df_line" | awk '{print $1}')"
          avail_kb="$(echo "$df_line" | awk '{print $4}')"
          avail_gb=$(( avail_kb / 1024 / 1024 ))
          echo "runner filesystem: $fs, available: ${avail_gb}GiB (min required: ${FORK_VERIFY_MIN_FREE_GB}GiB)"
          if [ "$avail_kb" -lt $(( FORK_VERIFY_MIN_FREE_GB * 1024 * 1024 )) ]; then
            echo "::error::FORK-VERIFY PREFLIGHT: host disk exhaustion on $fs — only ${avail_gb}GiB free (need >= ${FORK_VERIFY_MIN_FREE_GB}GiB). This is a RUNNER RESOURCE failure, not a code failure — no later step ran, so this candidate's code has not been evaluated. See gcf-b7fn."
            exit 1
          fi
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6
      - uses: actions/setup-go@4a3601121dd01d1626a1e23e37211e3254c1c06c # v6
        with:
          go-version: ${{ env.GO_VERSION }}
      - name: Verify jq is present (no sudo install on self-hosted)
        run: command -v jq || { echo "jq missing on this runner — sudo apt-get is not available on gt2, install it out-of-band"; exit 1; }
      - name: Install dolt v${{ env.DOLT_VERSION }} (cached, no sudo)
        run: .github/scripts/install-dolt-archive.sh "${{ env.DOLT_VERSION }}" --cache
      - name: Install bd ${{ env.BD_VERSION }} (cached, no sudo)
        run: .github/scripts/install-bd-archive.sh "${{ env.BD_VERSION }}" --cache
      - name: Build (compiles the whole tree — catches compile errors the macOS ICU break hides)
        run: go build ./...
      - name: Vet (whole tree — verified clean locally on gt2 before widening)
        run: go vet ./...
      - name: cipolicy — CI execution hash must match workflow reality
        run: go test ./scripts/cipolicy/... -count=1 -v
      - name: Release guard — release.yml must fail when VERSIONS GC_VERSION != tag (gcf-fag5s)
        run: bash scripts/test-release-versions-guard.sh
      - name: Unit tests — cross-store work delivery
        run: go test ./cmd/gc/ -run 'TestFilterAssignedWorkBeads|TestAssignedWork|TestFirstStoreWithWork|TestCrossStoreClaimDir|TestRunBDForBead|TestGateOpenWorkBounded|TestCrossStorePipeline' -count=1 -v
      - name: Unit tests — cross-store reachability predicate + fail-loud guard
        run: |
          go test ./internal/agentutil/ -run 'TestAgentReachesWorkflowStore|TestAgentIsCrossStoreEligible' -count=1 -v
          go test ./internal/sling/ -run 'TestValidateBuiltInRouteStoreReachableAllowsCityScopedTarget|TestDoSlingRefusesCrossStore' -count=1 -v
      - name: Unit tests — order scope (#2830)
        run: go test ./internal/orders/ -run 'TestParseScope|TestValidateRejectsUnknownScope|TestValidateAcceptsCityAndRigScope|TestParseEnv' -count=1 -v
      - name: Unit tests — scale from zero (#2819)
        run: go test ./cmd/gc/ -run 'TestBuildDesiredState_ScaleFromZero' -count=1 -v

  fresh-init-gate:
    name: fresh-init-gate
    # Runs on every PR and push:main (this job's own trigger, shared with
    # `verify` above), so a commit that breaks fresh `gc init` or a
    # city-with-rigs restart against the RELEASED bd (VERSIONS-pinned by
    # sha, NOT the `verify` job's own long-standing v1.1.0 contract-test
    # pin) cannot land on main and therefore cannot be tagged. Per pm's
    # W1-W4 ruling on gcf-g9j3: a tag-job-only gate fails after the tag
    # already exists (how v1.3.11 shipped broken) — see release.yml's
    # tripwire copy of this same check for the last-line-of-defense half.
    # Manual dispatch ONLY (pm M1, gcf-g9j3): a gate that is red on PRs for reasons unrelated to
    # the PR trains people to ignore red. Run: gh workflow run fork-verify.yml --ref <branch>
    if: ${{ github.event_name == 'workflow_dispatch' && github.repository != 'gastownhall/gascity' }}
    timeout-minutes: 40
    runs-on: [self-hosted, pool]
    env:
      GO_VERSION: "1.26.5"
      AC3_MIN_FREE_GB: "5"
    steps:
      - name: Preflight — fail fast and loud on host disk exhaustion (gcf-b7fn)
        run: |
          set -euo pipefail
          df_line="$(df -Pk . | tail -1)"
          avail_kb="$(echo "$df_line" | awk '{print $4}')"
          avail_gb=$(( avail_kb / 1024 / 1024 ))
          echo "runner filesystem available: ${avail_gb}GiB (min required: ${AC3_MIN_FREE_GB}GiB)"
          if [ "$avail_kb" -lt $(( AC3_MIN_FREE_GB * 1024 * 1024 )) ]; then
            echo "::error::AC3 PREFLIGHT: host disk exhaustion — only ${avail_gb}GiB free (need >= ${AC3_MIN_FREE_GB}GiB). Runner resource failure, not a code failure."
            exit 1
          fi
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6
      - uses: actions/setup-go@4a3601121dd01d1626a1e23e37211e3254c1c06c # v6
        with:
          go-version: ${{ env.GO_VERSION }}
      - name: Resolve VERSIONS pin
        id: pins
        run: |
          set -euo pipefail
          bd_version="$(grep -E '^BD_VERSION=' VERSIONS | cut -d= -f2)"
          dolt_version="$(grep -E '^DOLT_VERSION=' VERSIONS | cut -d= -f2)"
          test -n "$bd_version" || { echo "::error::BD_VERSION not found in VERSIONS"; exit 1; }
          test -n "$dolt_version" || { echo "::error::DOLT_VERSION not found in VERSIONS"; exit 1; }
          echo "bd_version=v${bd_version}" >> "$GITHUB_OUTPUT"
          echo "dolt_version=${dolt_version}" >> "$GITHUB_OUTPUT"
      - name: Install dolt ${{ steps.pins.outputs.dolt_version }} (VERSIONS-pinned, cached, no sudo)
        run: .github/scripts/install-dolt-archive.sh "${{ steps.pins.outputs.dolt_version }}" --cache
      - name: Install bd ${{ steps.pins.outputs.bd_version }} (VERSIONS-pinned, cached, no sudo)
        run: .github/scripts/install-bd-archive.sh "${{ steps.pins.outputs.bd_version }}" --cache
      - name: Verify installed bd/dolt actually match VERSIONS (not a stale cache hit)
        run: |
          set -euo pipefail
          got_bd="$(bd version 2>&1)"
          got_dolt="$(dolt version 2>&1)"
          echo "installed bd:   $got_bd"
          echo "installed dolt: $got_dolt"
          want_bd="${{ steps.pins.outputs.bd_version }}"; echo "$got_bd" | grep -qF "${want_bd#v}" || { echo "::error::installed bd does not report VERSIONS-pinned ${{ steps.pins.outputs.bd_version }} — got: $got_bd"; exit 1; }
          echo "$got_dolt" | grep -qF "${{ steps.pins.outputs.dolt_version }}" || { echo "::error::installed dolt does not report VERSIONS-pinned ${{ steps.pins.outputs.dolt_version }} — got: $got_dolt"; exit 1; }
      - name: Build the standalone gc binary (the shipped product path, not the in-process test binary)
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/gcf-g9j3-gate-j1-bin"
          go build -o "$RUNNER_TEMP/gcf-g9j3-gate-j1-bin/gc" ./cmd/gc
          "$RUNNER_TEMP/gcf-g9j3-gate-j1-bin/gc" version || true
      - name: J1 fresh-init gate — standalone gc + VERSIONS-pinned bd, N fresh inits (env -i inside the script)
        env:
          # dispatch inputs go through env, never interpolated into the script body
          FRESH_RUNS_INPUT: ${{ inputs.fresh_runs || '3' }}
          KEEP_GOING_INPUT: ${{ inputs.keep_going || '0' }}
        run: |
          set -euo pipefail
          # Per-run supervisor port so two concurrent gate jobs on the shared gt2
          # host cannot collide on the script's fixed default (28372).
          port=$(( 21000 + (GITHUB_RUN_ID + GITHUB_RUN_ATTEMPT * 7) % 6000 ))
          BD_BIN="$(command -v bd)" \
          GC_BIN="$RUNNER_TEMP/gcf-g9j3-gate-j1-bin/gc" \
          GCF_G9J3_GATE_WORKDIR="$RUNNER_TEMP/gcf-g9j3-gate-j1" \
          GCF_G9J3_GATE_SUPERVISOR_PORT="$port" \
          GCF_G9J3_GATE_FRESH_RUNS="$FRESH_RUNS_INPUT" \
          GCF_G9J3_GATE_FRESH_KEEP_GOING="$KEEP_GOING_INPUT" \
          GCF_G9J3_GATE_SKIP_RIG=1 \
            scripts/gcf-g9j3-fresh-init-gate.sh
      - name: Reap any dolt the gate left behind (always; scoped to this job's own gate workdir)
        if: ${{ always() }}
        run: |
          # The gate script only kills its dolt on the success path (no trap), so a
          # failing or timed-out gate leaks a sql-server onto this shared runner host.
          # Match ONLY processes whose argv names this job's gate workdir.
          d="$RUNNER_TEMP/gcf-g9j3-gate-j1"
          # Evidence for the lock-inside-dolt-data-dir hypothesis (gcf-g9j3): where do lock files sit?
          { echo "# lock paths under $d"; find "$d" -maxdepth 9 \( -name '.init-lock*' -o -name '.gc-init-locks' -o -name '*.lock' \) 2>/dev/null; } > "$d/lock-listing.txt" 2>&1 || true
          if pgrep -f -- "$d/" >/dev/null 2>&1; then
            echo "reaping leaked gate processes under $d:"; pgrep -af -- "$d/" || true
            pkill -9 -f -- "$d/" || true
          else
            echo "no leaked gate processes under $d"
          fi
      - name: Upload gate logs on failure
        if: ${{ failure() }}
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: gcf-g9j3-j1-logs
          include-hidden-files: true
          path: |
            ${{ runner.temp }}/gcf-g9j3-gate-j1/**/*.log
            ${{ runner.temp }}/gcf-g9j3-gate-j1/**/dolt-config.yaml
            ${{ runner.temp }}/gcf-g9j3-gate-j1/lock-listing.txt
          if-no-files-found: ignore

  rig-restart-gate:
    name: rig-restart-gate
    # Runs on every PR and push:main (this job's own trigger, shared with
    # `verify` above), so a commit that breaks fresh `gc init` or a
    # city-with-rigs restart against the RELEASED bd (VERSIONS-pinned by
    # sha, NOT the `verify` job's own long-standing v1.1.0 contract-test
    # pin) cannot land on main and therefore cannot be tagged. Per pm's
    # W1-W4 ruling on gcf-g9j3: a tag-job-only gate fails after the tag
    # already exists (how v1.3.11 shipped broken) — see release.yml's
    # tripwire copy of this same check for the last-line-of-defense half.
    # Manual dispatch ONLY (pm M1, gcf-g9j3): a gate that is red on PRs for reasons unrelated to
    # the PR trains people to ignore red. Run: gh workflow run fork-verify.yml --ref <branch>
    if: ${{ github.event_name == 'workflow_dispatch' && github.repository != 'gastownhall/gascity' }}
    timeout-minutes: 40
    runs-on: [self-hosted, pool]
    env:
      GO_VERSION: "1.26.5"
      AC3_MIN_FREE_GB: "5"
    steps:
      - name: Preflight — fail fast and loud on host disk exhaustion (gcf-b7fn)
        run: |
          set -euo pipefail
          df_line="$(df -Pk . | tail -1)"
          avail_kb="$(echo "$df_line" | awk '{print $4}')"
          avail_gb=$(( avail_kb / 1024 / 1024 ))
          echo "runner filesystem available: ${avail_gb}GiB (min required: ${AC3_MIN_FREE_GB}GiB)"
          if [ "$avail_kb" -lt $(( AC3_MIN_FREE_GB * 1024 * 1024 )) ]; then
            echo "::error::AC3 PREFLIGHT: host disk exhaustion — only ${avail_gb}GiB free (need >= ${AC3_MIN_FREE_GB}GiB). Runner resource failure, not a code failure."
            exit 1
          fi
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6
      - uses: actions/setup-go@4a3601121dd01d1626a1e23e37211e3254c1c06c # v6
        with:
          go-version: ${{ env.GO_VERSION }}
      - name: Resolve VERSIONS pin
        id: pins
        run: |
          set -euo pipefail
          bd_version="$(grep -E '^BD_VERSION=' VERSIONS | cut -d= -f2)"
          dolt_version="$(grep -E '^DOLT_VERSION=' VERSIONS | cut -d= -f2)"
          test -n "$bd_version" || { echo "::error::BD_VERSION not found in VERSIONS"; exit 1; }
          test -n "$dolt_version" || { echo "::error::DOLT_VERSION not found in VERSIONS"; exit 1; }
          echo "bd_version=v${bd_version}" >> "$GITHUB_OUTPUT"
          echo "dolt_version=${dolt_version}" >> "$GITHUB_OUTPUT"
      - name: Install dolt ${{ steps.pins.outputs.dolt_version }} (VERSIONS-pinned, cached, no sudo)
        run: .github/scripts/install-dolt-archive.sh "${{ steps.pins.outputs.dolt_version }}" --cache
      - name: Install bd ${{ steps.pins.outputs.bd_version }} (VERSIONS-pinned, cached, no sudo)
        run: .github/scripts/install-bd-archive.sh "${{ steps.pins.outputs.bd_version }}" --cache
      - name: Verify installed bd/dolt actually match VERSIONS (not a stale cache hit)
        run: |
          set -euo pipefail
          got_bd="$(bd version 2>&1)"
          got_dolt="$(dolt version 2>&1)"
          echo "installed bd:   $got_bd"
          echo "installed dolt: $got_dolt"
          want_bd="${{ steps.pins.outputs.bd_version }}"; echo "$got_bd" | grep -qF "${want_bd#v}" || { echo "::error::installed bd does not report VERSIONS-pinned ${{ steps.pins.outputs.bd_version }} — got: $got_bd"; exit 1; }
          echo "$got_dolt" | grep -qF "${{ steps.pins.outputs.dolt_version }}" || { echo "::error::installed dolt does not report VERSIONS-pinned ${{ steps.pins.outputs.dolt_version }} — got: $got_dolt"; exit 1; }
      - name: Build the standalone gc binary (the shipped product path, not the in-process test binary)
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/gcf-g9j3-gate-j2-bin"
          go build -o "$RUNNER_TEMP/gcf-g9j3-gate-j2-bin/gc" ./cmd/gc
          "$RUNNER_TEMP/gcf-g9j3-gate-j2-bin/gc" version || true
      - name: J2 rig-restart gate — 2 rigs, stop/start x2, positive readiness (env -i inside the script)
        run: |
          set -euo pipefail
          # Per-run supervisor port so two concurrent gate jobs on the shared gt2
          # host cannot collide on the script's fixed default (28372).
          port=$(( 21000 + (GITHUB_RUN_ID + GITHUB_RUN_ATTEMPT * 7 + 3000) % 6000 ))
          BD_BIN="$(command -v bd)" \
          GC_BIN="$RUNNER_TEMP/gcf-g9j3-gate-j2-bin/gc" \
          GCF_G9J3_GATE_WORKDIR="$RUNNER_TEMP/gcf-g9j3-gate-j2" \
          GCF_G9J3_GATE_SUPERVISOR_PORT="$port" \
          GCF_G9J3_GATE_SKIP_FRESH=1 \
            scripts/gcf-g9j3-fresh-init-gate.sh
      - name: Reap any dolt the gate left behind (always; scoped to this job's own gate workdir)
        if: ${{ always() }}
        run: |
          # The gate script only kills its dolt on the success path (no trap), so a
          # failing or timed-out gate leaks a sql-server onto this shared runner host.
          # Match ONLY processes whose argv names this job's gate workdir.
          d="$RUNNER_TEMP/gcf-g9j3-gate-j2"
          # Evidence for the lock-inside-dolt-data-dir hypothesis (gcf-g9j3): where do lock files sit?
          { echo "# lock paths under $d"; find "$d" -maxdepth 9 \( -name '.init-lock*' -o -name '.gc-init-locks' -o -name '*.lock' \) 2>/dev/null; } > "$d/lock-listing.txt" 2>&1 || true
          if pgrep -f -- "$d/" >/dev/null 2>&1; then
            echo "reaping leaked gate processes under $d:"; pgrep -af -- "$d/" || true
            pkill -9 -f -- "$d/" || true
          else
            echo "no leaked gate processes under $d"
          fi
      - name: Upload gate logs on failure
        if: ${{ failure() }}
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: gcf-g9j3-j2-logs
          include-hidden-files: true
          path: |
            ${{ runner.temp }}/gcf-g9j3-gate-j2/**/*.log
            ${{ runner.temp }}/gcf-g9j3-gate-j2/**/dolt-config.yaml
            ${{ runner.temp }}/gcf-g9j3-gate-j2/lock-listing.txt
          if-no-files-found: ignore

  unit-cmd-gc:
    name: unit-cmd-gc
    # gcf-6rbt: the required `verify` check runs only an allowlist of named tests, so #68 broke
    # cmd/gc tests and verify stayed green. This job runs the WHOLE cmd/gc fast suite plus the
    # test-policy packages that also broke (resourcecensus, docsync), in the repo's own hermetic
    # test env (scripts/test-go-test-shard). It is a NEW job; `verify` is unchanged. It is NOT
    # required yet: pm's bar is 5 consecutive green runs on unchanged main, zero retries.
    # Deliberately excludes unit-core (internal/productmetrics timing tests flake under load: gcf-30gb).
    #
    # gcf-a28gx: this job used to be 14-21 min wall: install dolt+bd, then 6 shards back to back, each run through
    # `go test` (list + compile + link), then the policy packages. Measured on Anton, the shards spend most of their
    # time waiting, not computing (a shard: ~30 s user, ~20 s sys over ~90 s wall), and the fast suite uses neither
    # dolt nor bd. So, still ONE job (sharding it into 3 legs cost +86% runner-min and was slower on a saturated pool):
    #   * no dolt/bd install (15-280 s). Evidence: with the prebuilt test binary and dolt/bd off PATH all 6 shards pass,
    #     and shard 6 is identical with and without them (5911 pass, the same 18 skips, 0 fail). A test added to the
    #     fast suite that needs dolt/bd must be tagged out of it, or the installs come back.
    #   * compile the cmd/gc test binary ONCE (`go test -c`), then run the repo's 6 shards (same round-robin partition,
    #     same -run regexes, same hermetic env) as 6 parallel processes of that binary, with the policy packages
    #     alongside. setup-go keeps its module+build cache restore: with it the compile is ~60 s, without it ~270 s
    #     cold on 4 cores (measured), so skipping the restore would cost more than it saves in a job that compiles.
    #   * the shard-union guard proves the six shards still ran exactly the full `go test -list` (test count
    #     unchanged), and goes red on a dropped/duplicated/missing shard (negative control runs every time).
    if: ${{ github.repository != 'gastownhall/gascity' }}
    runs-on: [self-hosted, pool]
    timeout-minutes: 30
    env:
      GO_VERSION: "1.26.5"
      UNIT_MIN_FREE_GB: "5"
      # CI runners' user systemd cannot reliably create the transient scope the slice helper
      # re-execs into (see rc-gate.yml); plain execution is the historical default.
      GC_TEST_NO_SLICE: "1"
    steps:
      - name: Preflight — fail fast and loud on host disk exhaustion (gcf-b7fn)
        run: |
          set -euo pipefail
          df_line="$(df -Pk . | tail -1)"
          avail_kb="$(echo "$df_line" | awk '{print $4}')"
          avail_gb=$(( avail_kb / 1024 / 1024 ))
          echo "runner filesystem available: ${avail_gb}GiB (min required: ${UNIT_MIN_FREE_GB}GiB)"
          if [ "$avail_kb" -lt $(( UNIT_MIN_FREE_GB * 1024 * 1024 )) ]; then
            echo "::error::UNIT-CMD-GC PREFLIGHT: host disk exhaustion — only ${avail_gb}GiB free (need >= ${UNIT_MIN_FREE_GB}GiB). Runner resource failure, not a code failure."
            exit 1
          fi
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6
      - uses: actions/setup-go@4a3601121dd01d1626a1e23e37211e3254c1c06c # v6
        with:
          go-version: ${{ env.GO_VERSION }}
      - name: Verify jq is present (no sudo install on self-hosted)
        run: command -v jq || { echo "jq missing on this runner — sudo apt-get is not available on gt2, install it out-of-band"; exit 1; }
      - name: Compile the cmd/gc test binary once
        run: |
          set -euo pipefail
          out="$RUNNER_TEMP/gc-test"
          mkdir -p "$out"
          start=$SECONDS
          go test -c -o "$out/cmd-gc.test" ./cmd/gc
          ls -l "$out/cmd-gc.test" | awk '{printf "test binary: %.0f MB\n", $5/1e6}' | tee -a "$GITHUB_STEP_SUMMARY"
          echo "compile wall time: $(( SECONDS - start ))s" | tee -a "$GITHUB_STEP_SUMMARY"
      - name: cmd/gc fast suite (repo's 6 shards in parallel on the one test binary) + test-policy packages
        env:
          # How many of the 6 shards run at once. 6 = all; lower it if the memory line below ever nears the VM's RAM.
          UNIT_SHARD_PARALLEL: "6"
        run: |
          # One `-run` regex per shard: the whole package as ONE regex is 452,085 bytes, over Linux's 131,072-byte
          # MAX_ARG_STRLEN (exec fails with 126), hence the repo's own 6 shards, ~75 KB each.
          # Every shard and the policy run are background processes; none aborts the others, so one run reports every
          # failing test. GitHub runs `bash -e {0}`: `set +e` first.
          # FAIL CLOSED: a shard writes shard-N.rc only after it finished. A killed shard (OOM, cancel, SIGKILL) leaves
          # no .rc, and scripts/ci-collect-shard-results turns a missing .rc, or fewer than 6 of them, into red.
          set +e
          set -uo pipefail
          logs="$RUNNER_TEMP/gc-test/logs"
          lists="$RUNNER_TEMP/gc-test/lists"
          mkdir -p "$logs" "$lists"
          total_start=$SECONDS
          # Peak memory of the VM while the suite runs (the VM is dedicated to this job): MemTotal - MemAvailable, 1 Hz.
          mem_base_mb=$(awk '/MemTotal/{t=$2} /MemAvailable/{a=$2} END{print int((t-a)/1024)}' /proc/meminfo)
          mem_total_mb=$(awk '/MemTotal/{print int($2/1024)}' /proc/meminfo)
          echo "$mem_base_mb" > "$logs/mem-peak-mb"
          (
            peak="$mem_base_mb"
            while :; do
              used=$(awk '/MemTotal/{t=$2} /MemAvailable/{a=$2} END{print int((t-a)/1024)}' /proc/meminfo)
              if [ "$used" -gt "$peak" ]; then peak="$used"; echo "$peak" > "$logs/mem-peak-mb"; fi
              sleep 1
            done
          ) &
          sampler=$!
          run_shard() {
            local i="$1" start=$SECONDS
            GC_TEST_BINARY="$RUNNER_TEMP/gc-test/cmd-gc.test" \
            GC_TEST_SHARD_FULL_LIST_OUT="$lists/full-$i.txt" GC_TEST_SHARD_SELECTED_OUT="$lists/selected-$i.txt" \
            GC_FAST_UNIT=1 GO_TEST_COUNT=1 GO_TEST_TIMEOUT=30m \
              ./scripts/test-go-test-shard ./cmd/gc "$i" 6 > "$logs/shard-$i.log" 2>&1
            echo $? > "$logs/shard-$i.rc"
            echo "cmd/gc shard $i/6: exit=$(cat "$logs/shard-$i.rc") wall=$(( SECONDS - start ))s" > "$logs/shard-$i.sum"
          }
          pids=()
          (
            start=$SECONDS
            go test ./internal/testpolicy/... ./test/docsync/... ./scripts/... -count=1 > "$logs/policy.log" 2>&1
            echo $? > "$logs/policy.rc"
            echo "policy packages: exit=$(cat "$logs/policy.rc") wall=$(( SECONDS - start ))s" > "$logs/policy.sum"
          ) &
          pids+=($!)
          # The pool runs in its own subshell so its `wait -n` only sees shards, not the policy job or the sampler (gcf-lgfao).
          source scripts/lib/shard-pool.sh
          ( shard_pool_run 6 "$UNIT_SHARD_PARALLEL" run_shard ) &
          pids+=($!)
          # explicit pids: a bare `wait` would also wait for the memory sampler forever
          wait "${pids[@]}" 2>/dev/null
          kill "$sampler" 2>/dev/null; wait "$sampler" 2>/dev/null
          peak_mb=$(cat "$logs/mem-peak-mb")
          echo "peak memory used on the VM during the suite: ${peak_mb} MiB of ${mem_total_mb} MiB (baseline before ${mem_base_mb} MiB), $UNIT_SHARD_PARALLEL shards at once" | tee -a "$GITHUB_STEP_SUMMARY"
          echo "cmd/gc fast suite + policy total wall time: $(( SECONDS - total_start ))s" | tee -a "$GITHUB_STEP_SUMMARY"
          ./scripts/ci-collect-shard-results "$logs" 6 | tee -a "$GITHUB_STEP_SUMMARY"
          [ "${PIPESTATUS[0]}" -eq 0 ]
      - name: Prove the result collector fails closed (killed shard, missing rc), the shard pool honours its cap, and the union guard goes red
        run: |
          bash scripts/test-ci-collect-shard-results.sh
          bash scripts/test-shard-pool.sh
          bash scripts/test-check-shard-union.sh
      - name: Shard-union check — the 6 shards still ran exactly the full cmd/gc test list (count unchanged)
        run: |
          set -euo pipefail
          d="$RUNNER_TEMP/gc-test/lists"
          for f in "$d"/full-*.txt; do cmp -s "$f" "$d/full-1.txt" || { echo "::error::$f differs from full-1.txt: the shards did not see the same test list"; exit 1; }; done
          cp "$d/full-1.txt" "$d/full.txt"
          scripts/check-shard-union "$d" 6 | tee -a "$GITHUB_STEP_SUMMARY"

  examples:
    name: examples
    # gcf-u3ck2: neither `verify` (allowlist of named tests) nor `unit-cmd-gc` ever ran ./examples/...,
    # so a PR touching examples/bd or examples/gastown showed green with zero coverage of them. This job
    # runs the whole ./examples/... tree. NEW job; `verify` is unchanged.
    # Affected-only (ci-diet): on a pull_request it runs the tests only when the PR touches a path the
    # examples tests depend on; push:main and workflow_dispatch always run them. A skipped run still
    # reports success, so the check can be made required without blocking unrelated PRs.
    if: ${{ github.repository != 'gastownhall/gascity' }}
    runs-on: [self-hosted, pool]
    timeout-minutes: 30
    env:
      DOLT_VERSION: "2.1.10"
      BD_VERSION: "v1.1.0"
      GO_VERSION: "1.26.5"
      EXAMPLES_MIN_FREE_GB: "5"
      GC_TEST_NO_SLICE: "1"
      PR_BASE_SHA: ${{ github.event.pull_request.base.sha }}
    steps:
      - name: Preflight — fail fast and loud on host disk exhaustion (gcf-b7fn)
        run: |
          set -euo pipefail
          df_line="$(df -Pk . | tail -1)"
          avail_kb="$(echo "$df_line" | awk '{print $4}')"
          avail_gb=$(( avail_kb / 1024 / 1024 ))
          echo "runner filesystem available: ${avail_gb}GiB (min required: ${EXAMPLES_MIN_FREE_GB}GiB)"
          if [ "$avail_kb" -lt $(( EXAMPLES_MIN_FREE_GB * 1024 * 1024 )) ]; then
            echo "::error::EXAMPLES PREFLIGHT: host disk exhaustion — only ${avail_gb}GiB free (need >= ${EXAMPLES_MIN_FREE_GB}GiB). Runner resource failure, not a code failure."
            exit 1
          fi
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6
      - name: Decide whether the examples tests are affected
        id: affected
        run: |
          set -euo pipefail
          if [ "${{ github.event_name }}" != "pull_request" ]; then
            echo "run=true" >> "$GITHUB_OUTPUT"
            echo "event ${{ github.event_name }}: always run" | tee -a "$GITHUB_STEP_SUMMARY"
            exit 0
          fi
          git fetch --no-tags --depth=1 origin "$PR_BASE_SHA"
          changed="$(git diff --name-only "$PR_BASE_SHA" HEAD)"
          if echo "$changed" | grep -qE '^(examples/|internal/testenv/|go\.mod$|go\.sum$|\.github/workflows/fork-verify\.yml$)'; then
            echo "run=true" >> "$GITHUB_OUTPUT"
            echo "examples affected; running ./examples/..." | tee -a "$GITHUB_STEP_SUMMARY"
          else
            echo "run=false" >> "$GITHUB_OUTPUT"
            echo "no examples-relevant path changed; skipping ./examples/..." | tee -a "$GITHUB_STEP_SUMMARY"
          fi
      - uses: actions/setup-go@4a3601121dd01d1626a1e23e37211e3254c1c06c # v6
        if: ${{ steps.affected.outputs.run == 'true' }}
        with:
          go-version: ${{ env.GO_VERSION }}
      - name: Verify jq is present (no sudo install on self-hosted)
        if: ${{ steps.affected.outputs.run == 'true' }}
        run: command -v jq || { echo "jq missing on this runner — sudo apt-get is not available on gt2, install it out-of-band"; exit 1; }
      - name: Install dolt v${{ env.DOLT_VERSION }} (cached, no sudo)
        if: ${{ steps.affected.outputs.run == 'true' }}
        run: .github/scripts/install-dolt-archive.sh "${{ env.DOLT_VERSION }}" --cache
      - name: Install bd ${{ env.BD_VERSION }} (cached, no sudo)
        if: ${{ steps.affected.outputs.run == 'true' }}
        run: .github/scripts/install-bd-archive.sh "${{ env.BD_VERSION }}" --cache
      - name: Unit tests — ./examples/... (bd, dolt, gastown, swarm, t3bridge-gastown)
        if: ${{ steps.affected.outputs.run == 'true' }}
        run: |
          set -euo pipefail
          start=$SECONDS
          go test ./examples/... -count=1
          echo "examples wall time: $(( SECONDS - start ))s" | tee -a "$GITHUB_STEP_SUMMARY"
