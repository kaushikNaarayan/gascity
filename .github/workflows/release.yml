name: Release

# Release jobs run exclusively on our self-hosted [self-hosted, gt2] runners.
# GoReleaser cross-compiles linux/darwin from one Linux runner (CGO_ENABLED=0,
# see .goreleaser.yml), so gt2 is sufficient for all four platform/arch builds.

on:
  push:
    tags:
      - "v*"
  # Manual dispatch is only for rerunning a release from a v* tag. Publishing
  # jobs below are tag-gated and skip branch refs.
  workflow_dispatch:

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

permissions: {}

jobs:
  release:
    name: Release
    if: ${{ contains(fromJSON('["gastownhall/gascity", "material-lab-io/gascity"]'), github.repository) && startsWith(github.ref, 'refs/tags/v') && !contains(github.ref_name, '-') }}
    runs-on: [self-hosted, gt2]
    permissions:
      contents: write
    env:
      # gt2's root filesystem is shared by all three runners, /tmp and every
      # agent worktree — it hit 0 bytes free mid cross-build on v1.3.11
      # (gcf-6o8l), 42s into GoReleaser, after six earlier steps had already
      # gone green. That read like a code/toolchain failure to triage later;
      # it wasn't. This is a preflight tripwire, not a capacity plan. The
      # threshold is higher than fork-verify's (gcf-b7fn, 5GB) because this
      # job cross-builds four linux/darwin x amd64/arm64 targets, not one.
      RELEASE_MIN_FREE_GB: "15"
    steps:
      - name: Preflight — fail fast and loud on host disk exhaustion (gcf-6o8l)
        run: |
          set -euo pipefail
          df_line="$(df -Pk . | tail -1)"
          fs="$(echo "$df_line" | awk '{print $1}')"
          avail_kb="$(echo "$df_line" | awk '{print $4}')"
          avail_gb=$(( avail_kb / 1024 / 1024 ))
          echo "runner filesystem: $fs, available: ${avail_gb}GiB (min required: ${RELEASE_MIN_FREE_GB}GiB)"
          if [ "$avail_kb" -lt $(( RELEASE_MIN_FREE_GB * 1024 * 1024 )) ]; then
            echo "::error::RELEASE PREFLIGHT: host disk exhaustion on $fs — only ${avail_gb}GiB free (need >= ${RELEASE_MIN_FREE_GB}GiB). This is a RUNNER RESOURCE failure, not a code failure — no later step ran, so GoReleaser has not built anything. See gcf-6o8l."
            exit 1
          fi

      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6
        with:
          fetch-depth: 0

      - uses: actions/setup-go@4a3601121dd01d1626a1e23e37211e3254c1c06c # v6
        with:
          go-version-file: go.mod

      - name: Reject replace directives in go.mod
        run: |
          if grep -qE '^replace\s' go.mod; then
            echo "ERROR: go.mod contains replace directives — aborting release."
            echo "Replace directives break 'go install ...@latest' and bottle builds in homebrew-core."
            grep -n '^replace' go.mod
            exit 1
          fi

      - name: Verify release tag is stable
        run: make check-version-tag

      - name: Verify release output is ignored
        run: make check-release-dist-ignore

      - name: Resolve VERSIONS pin (gcf-g9j3 tripwire)
        id: pins
        run: |
          set -euo pipefail
          bd_version="$(grep -E '^BD_VERSION=' VERSIONS | cut -d= -f2)"
          dolt_version="$(grep -E '^DOLT_VERSION=' VERSIONS | cut -d= -f2)"
          test -n "$bd_version" || { echo "::error::BD_VERSION not found in VERSIONS"; exit 1; }
          test -n "$dolt_version" || { echo "::error::DOLT_VERSION not found in VERSIONS"; exit 1; }
          echo "bd_version=v${bd_version}" >> "$GITHUB_OUTPUT"
          echo "dolt_version=${dolt_version}" >> "$GITHUB_OUTPUT"

      - name: Install dolt ${{ steps.pins.outputs.dolt_version }} (VERSIONS-pinned, cached, no sudo)
        run: .github/scripts/install-dolt-archive.sh "${{ steps.pins.outputs.dolt_version }}" --cache

      - name: Install bd ${{ steps.pins.outputs.bd_version }} (VERSIONS-pinned, cached, no sudo)
        run: .github/scripts/install-bd-archive.sh "${{ steps.pins.outputs.bd_version }}" --cache

      - name: Verify installed bd/dolt actually match VERSIONS (not a stale cache hit)
        run: |
          set -euo pipefail
          got_bd="$(bd version 2>&1)"
          got_dolt="$(dolt version 2>&1)"
          echo "installed bd:   $got_bd"
          echo "installed dolt: $got_dolt"
          echo "$got_bd" | grep -qF "${{ steps.pins.outputs.bd_version }}" || { echo "::error::installed bd does not report VERSIONS-pinned ${{ steps.pins.outputs.bd_version }} — got: $got_bd"; exit 1; }
          echo "$got_dolt" | grep -qF "${{ steps.pins.outputs.dolt_version }}" || { echo "::error::installed dolt does not report VERSIONS-pinned ${{ steps.pins.outputs.dolt_version }} — got: $got_dolt"; exit 1; }

      - name: Build the standalone gc binary (the shipped product path, not the in-process test binary)
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/gcf-g9j3-gate-bin"
          go build -o "$RUNNER_TEMP/gcf-g9j3-gate-bin/gc" ./cmd/gc
          "$RUNNER_TEMP/gcf-g9j3-gate-bin/gc" version || true
      - name: gcf-g9j3 tripwire (BLOCKING) — fresh inits only, standalone gc + VERSIONS-pinned bd (env -i inside the script)
        # pm M2 (gcf-g9j3): a red tripwire means we do NOT publish. Re-running is allowed; overriding
        # needs a pm decision recorded on the bead. Must stay BEFORE 'Run GoReleaser'.
        run: |
          set -euo pipefail
          # Per-run supervisor port so two concurrent gate jobs on the shared gt2
          # host cannot collide on the script's fixed default (28372).
          port=$(( 21000 + (GITHUB_RUN_ID + GITHUB_RUN_ATTEMPT * 7) % 6000 ))
          BD_BIN="$(command -v bd)" \
          GC_BIN="$RUNNER_TEMP/gcf-g9j3-gate-bin/gc" \
          GCF_G9J3_GATE_WORKDIR="$RUNNER_TEMP/gcf-g9j3-gate" \
          GCF_G9J3_GATE_SUPERVISOR_PORT="$port" \
          GCF_G9J3_GATE_SKIP_RIG=1 \
            scripts/gcf-g9j3-fresh-init-gate.sh
      - name: Reap any dolt the gate left behind (always; scoped to this job's own gate workdir)
        if: ${{ always() }}
        run: |
          # The gate script only kills its dolt on the success path (no trap), so a
          # failing or timed-out gate leaks a sql-server onto this shared runner host.
          # Match ONLY processes whose argv names this job's gate workdir.
          d="$RUNNER_TEMP/gcf-g9j3-gate"
          # Evidence for the lock-inside-dolt-data-dir hypothesis (gcf-g9j3): where do lock files sit?
          { echo "# lock paths under $d"; find "$d" -maxdepth 9 \( -name '.init-lock*' -o -name '.gc-init-locks' -o -name '*.lock' \) 2>/dev/null; } > "$d/lock-listing.txt" 2>&1 || true
          if pgrep -f -- "$d/" >/dev/null 2>&1; then
            echo "reaping leaked gate processes under $d:"; pgrep -af -- "$d/" || true
            pkill -9 -f -- "$d/" || true
          else
            echo "no leaked gate processes under $d"
          fi
      - name: Upload gate logs on failure
        if: ${{ failure() }}
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: gcf-g9j3-gate-logs
          include-hidden-files: true
          path: |
            ${{ runner.temp }}/gcf-g9j3-gate/**/*.log
            ${{ runner.temp }}/gcf-g9j3-gate/**/dolt-config.yaml
            ${{ runner.temp }}/gcf-g9j3-gate/lock-listing.txt
          if-no-files-found: ignore

      - name: Run GoReleaser
        uses: goreleaser/goreleaser-action@1a80836c5c9d9e5755a25cb59ec6f45a3b5f41a8 # v7
        with:
          version: "~> v2"
          args: >
            release --clean
            ${{ !contains(fromJSON('["gastownhall/gascity", "material-lab-io/gascity"]'), github.repository) && '--skip=publish --skip=announce' || '' }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GORELEASER_CURRENT_TAG: ${{ github.ref_name }}

      - name: Verify release binary metadata
        run: |
          set -euo pipefail
          expected_commit="$(git rev-parse "${GITHUB_REF_NAME}^{commit}")"
          scripts/verify-release-binary-metadata.sh \
            dist/gascity_linux_amd64_v1/gc \
            "$expected_commit" \
            "${GITHUB_REF_NAME#v}"

  attest-release:
    name: Attest release
    # Temporary founder decision (gcf-uyut, 2026-08-30): material-lab-io's
    # private-org plan cannot persist GitHub attestations. Keep generating and
    # uploading the SBOM, but do not let this unavailable service block binary
    # releases. Permanent policy is tracked by gcf-69bt.
    continue-on-error: true
    if: ${{ contains(fromJSON('["gastownhall/gascity", "material-lab-io/gascity"]'), github.repository) && startsWith(github.ref, 'refs/tags/v') && !contains(github.ref_name, '-') }}
    needs: release
    runs-on: [self-hosted, gt2]
    permissions:
      attestations: write
      contents: write
      id-token: write
    steps:
      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6

      - name: Verify gh is present (no sudo install on self-hosted)
        run: command -v gh || { echo "gh missing on this runner — sudo apt-get is not available on gt2, install it out-of-band"; exit 1; }

      - name: Resolve release asset paths
        id: assets
        run: |
          version="${GITHUB_REF_NAME#v}"
          mkdir -p dist
          echo "checksums=dist/gascity_${version}_checksums.txt" >> "$GITHUB_OUTPUT"
          echo "sbom=dist/gascity-${GITHUB_REF_NAME}.spdx.json" >> "$GITHUB_OUTPUT"

      - name: Download release checksums
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          version="${GITHUB_REF_NAME#v}"
          gh release download "${GITHUB_REF_NAME}" --pattern "gascity_${version}_checksums.txt" --dir dist

      - name: Generate release SBOM
        uses: anchore/sbom-action@e22c389904149dbc22b58101806040fa8d37a610 # v0
        with:
          path: .
          format: spdx-json
          output-file: ${{ steps.assets.outputs.sbom }}
          upload-artifact: false
          upload-release-assets: false

      - name: Upload release SBOM
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh release upload "${GITHUB_REF_NAME}" "${{ steps.assets.outputs.sbom }}" --clobber

      - name: Attest release artifacts
        uses: actions/attest@59d89421af93a897026c735860bf21b6eb4f7b26 # v4
        with:
          subject-checksums: ${{ steps.assets.outputs.checksums }}

      - name: Attest release SBOM
        uses: actions/attest@59d89421af93a897026c735860bf21b6eb4f7b26 # v4
        with:
          subject-checksums: ${{ steps.assets.outputs.checksums }}
          sbom-path: ${{ steps.assets.outputs.sbom }}

  update-homebrew-formula:
    name: Update Homebrew formula
    if: ${{ github.repository == 'gastownhall/gascity' && startsWith(github.ref, 'refs/tags/v') && !contains(github.ref_name, '-') }}
    needs: release
    runs-on: [self-hosted, gt2]
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6

      - name: Extract version from tag
        id: version
        run: echo "version=${GITHUB_REF_NAME#v}" >> "$GITHUB_OUTPUT"

      - name: Verify Homebrew tap app credentials
        env:
          HOMEBREW_TAP_APP_ID: ${{ secrets.HOMEBREW_TAP_APP_ID }}
          HOMEBREW_TAP_APP_PRIVATE_KEY: ${{ secrets.HOMEBREW_TAP_APP_PRIVATE_KEY }}
        run: |
          if [ -z "$HOMEBREW_TAP_APP_ID" ] || [ -z "$HOMEBREW_TAP_APP_PRIVATE_KEY" ]; then
            echo "ERROR: HOMEBREW_TAP_APP_ID and HOMEBREW_TAP_APP_PRIVATE_KEY are required for tap publishing." >&2
            exit 1
          fi

      - name: Mint Homebrew tap token
        id: homebrew-token
        uses: actions/create-github-app-token@1b10c78c7865c340bc4f6099eb2f838309f1e8c3 # v3
        with:
          app-id: ${{ secrets.HOMEBREW_TAP_APP_ID }}
          private-key: ${{ secrets.HOMEBREW_TAP_APP_PRIVATE_KEY }}
          owner: gastownhall
          repositories: homebrew-gascity
          permission-contents: write

      - name: Generate and push Homebrew formula
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          HOMEBREW_TAP_TOKEN: ${{ steps.homebrew-token.outputs.token }}
        run: |
          version="${{ steps.version.outputs.version }}"
          tag="v${version}"
          base_url="https://github.com/gastownhall/gascity/releases/download/${tag}"

          gh release download "${tag}" --pattern "gascity_${version}_checksums.txt" --dir /tmp
          checksums_file="/tmp/gascity_${version}_checksums.txt"

          get_sha256() {
            local sha
            sha=$(grep "$1" "$checksums_file" | awk '{print $1}')
            if [ -z "$sha" ]; then
              echo "ERROR: missing checksum for $1" >&2
              exit 1
            fi
            echo "$sha"
          }

          darwin_arm64_sha=$(get_sha256 "gascity_${version}_darwin_arm64.tar.gz")
          darwin_amd64_sha=$(get_sha256 "gascity_${version}_darwin_amd64.tar.gz")
          linux_amd64_sha=$(get_sha256 "gascity_${version}_linux_amd64.tar.gz")
          linux_arm64_sha=$(get_sha256 "gascity_${version}_linux_arm64.tar.gz")

          cat > /tmp/gascity.rb <<FORMULA
          # typed: false
          # frozen_string_literal: true

          class Gascity < Formula
            desc "Orchestration-builder SDK for multi-agent coding workflows"
            homepage "https://github.com/gastownhall/gascity"
            version "${version}"
            license "MIT"

            on_macos do
              if Hardware::CPU.arm?
                url "${base_url}/gascity_${version}_darwin_arm64.tar.gz"
                sha256 "${darwin_arm64_sha}"
              else
                url "${base_url}/gascity_${version}_darwin_amd64.tar.gz"
                sha256 "${darwin_amd64_sha}"
              end
            end

            on_linux do
              if Hardware::CPU.arm?
                url "${base_url}/gascity_${version}_linux_arm64.tar.gz"
                sha256 "${linux_arm64_sha}"
              else
                url "${base_url}/gascity_${version}_linux_amd64.tar.gz"
                sha256 "${linux_amd64_sha}"
              end
            end

            depends_on "beads"
            depends_on "jq"
            depends_on "tmux"

            on_macos do
              depends_on "flock"
            end

            def install
              bin.install "gc"
            end

            def caveats
              <<~EOS
                Gas City depends on these runtime tools, installed as dependencies:
                  beads (bd)  - issue tracker
                  dolt        - beads storage (via beads)
                  flock       - file locking
                  jq          - JSON processing
                  tmux        - session management

                Get started:
                  gc init <city-path>      # create a new city
                  gc start <city-path>     # start an existing city
              EOS
            end

            test do
              assert_match version.to_s, shell_output("#{bin}/gc version")
            end
          end
          FORMULA
          sed -i 's/^          //' /tmp/gascity.rb

          cd /tmp
          git clone "https://x-access-token:${HOMEBREW_TAP_TOKEN}@github.com/gastownhall/homebrew-gascity.git"
          cp gascity.rb homebrew-gascity/Formula/gascity.rb
          cd homebrew-gascity
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add Formula/gascity.rb
          git commit -m "gascity ${version}" || echo "No changes to commit"
          git push
