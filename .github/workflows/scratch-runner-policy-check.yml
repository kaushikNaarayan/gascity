name: Scratch runner policy check

on:
  workflow_dispatch: {}

permissions:
  contents: read

jobs:
  runner-policy:
    name: Runner policy
    runs-on: ubuntu-latest
    outputs:
      runner_2vcpu: ${{ steps.policy.outputs.runner_2vcpu }}
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6
      - name: Select runner backend
        id: policy
        env:
          EVENT_NAME: ${{ github.event_name }}
          PR_AUTHOR: ${{ github.event.pull_request.user.login }}
          FORCE_BLACKSMITH: "false"
        run: |
          python3 .github/workflows/scripts/runner_policy.py

  consume:
    name: Consume runner policy output
    needs: runner-policy
    runs-on: ${{ needs.runner-policy.outputs.runner_2vcpu }}
    steps:
      - run: echo "scheduled on $(hostname)"
